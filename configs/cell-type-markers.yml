# This mapping is used only after annotation to compare detailed labels with
# the source-provided broad Cell_type reference.
evaluation:
  source_label_order:
    - T lymphocytes
    - B lymphocytes
    - NK cells
    - Myeloid cells
    - Epithelial cells
    - Fibroblasts
    - MAST cells
    - Endothelial cells
  detailed_to_source:
    T cell: T lymphocytes
    B cell: B lymphocytes
    Plasma cell: B lymphocytes
    NK cell: NK cells
    Macrophage: Myeloid cells
    Monocyte: Myeloid cells
    Dendritic cell: Myeloid cells
    Mast cell: MAST cells
    Epithelial cell: Epithelial cells
    Endothelial cell: Endothelial cells
    Fibroblast: Fibroblasts
    Myofibroblast: Fibroblasts
    Pericyte: unmatched
    Smooth muscle cell: unmatched
    Mesothelial cell: unmatched
