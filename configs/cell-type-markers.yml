# Lung and tumor-microenvironment marker panel for annotation.
source:
  database: CellMarker 2.0
  url: https://bio-bigdata.hrbmu.edu.cn/CellMarker2.0/
  downloaded_file: Cell_marker_Human.xlsx
  downloaded_on: 2026-11-24
  filters: Human records with tissue_type Lung, including lung-cancer entries when available

